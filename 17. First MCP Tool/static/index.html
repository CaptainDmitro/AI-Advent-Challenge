<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>First MCP Tool</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f6f8;
    --surface: #ffffff;
    --border: #e2e4e9;
    --text: #1a1d23;
    --text-muted: #6b7280;
    --primary: #4f46e5;
    --primary-hover: #4338ca;
    --chip-bg: #eef0ff;
    --code-bg: #f0f1f4;
    --ok: #16a34a;
    --err: #dc2626;
    --shadow: 0 1px 2px rgba(16, 24, 40, 0.06), 0 1px 3px rgba(16, 24, 40, 0.08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a;
      --surface: #1c1f26;
      --border: #2c3038;
      --text: #e7e9ec;
      --text-muted: #9aa1ac;
      --primary: #6366f1;
      --primary-hover: #7c7ff2;
      --chip-bg: #262a40;
      --code-bg: #262a33;
      --ok: #22c55e;
      --err: #f87171;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 2px 6px rgba(0, 0, 0, 0.35);
    }
  }

  * { box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    max-width: 860px;
    margin: 0 auto;
    padding: 2.5rem 1.5rem 2rem;
  }

  header { text-align: center; margin-bottom: 1.5rem; }
  h1 { font-size: 1.7rem; font-weight: 700; margin: 0 0 0.4rem; letter-spacing: -0.01em; }
  header p { color: var(--text-muted); margin: 0; font-size: 0.98rem; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: var(--shadow);
    padding: 1.1rem 1.25rem;
    margin-bottom: 1rem;
  }
  .card h2 {
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-muted);
    margin: 0 0 0.8rem;
  }

  textarea {
    width: 100%;
    min-height: 4.2rem;
    resize: vertical;
    font: inherit;
    font-size: 0.98rem;
    color: var(--text);
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 0.6rem 0.7rem;
  }
  .examples { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 0.6rem; }
  .chip {
    background: var(--chip-bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 0.3rem 0.7rem;
    font-size: 0.8rem;
    font-weight: 500;
  }
  .actions { display: flex; justify-content: space-between; align-items: center; gap: 0.6rem; margin-top: 0.8rem; }
  .hint { color: var(--text-muted); font-size: 0.8rem; overflow-wrap: anywhere; }

  button {
    border: none;
    border-radius: 9px;
    padding: 0.55rem 1.2rem;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.05s ease;
  }
  button:active:not(:disabled) { transform: scale(0.98); }
  button:disabled { opacity: 0.55; cursor: not-allowed; }
  #ask { background: var(--primary); color: #fff; flex: none; }
  #ask:hover:not(:disabled) { background: var(--primary-hover); }

  .status { display: flex; align-items: center; gap: 0.55rem; font-weight: 600; }
  .dot { width: 0.65rem; height: 0.65rem; border-radius: 50%; background: var(--text-muted); flex: none; }
  .status.ok .dot { background: var(--ok); }
  .status.err .dot { background: var(--err); }
  .status.pending .dot { animation: pulse 1.1s ease-in-out infinite; }
  .status.err .msg { color: var(--err); }
  @keyframes pulse { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }

  code, pre {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 0.84em;
  }
  code { background: var(--code-bg); padding: 0.1em 0.35em; border-radius: 4px; }
  pre {
    background: var(--code-bg);
    padding: 0.7em;
    border-radius: 8px;
    overflow-x: auto;
    margin: 0.5em 0 0;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }

  dl.meta {
    display: grid;
    grid-template-columns: max-content 1fr;
    gap: 0.35rem 1rem;
    margin: 0 0 0.6rem;
    font-size: 0.88rem;
  }
  dl.meta dt { color: var(--text-muted); }
  dl.meta dd { margin: 0; overflow-wrap: anywhere; }

  .step { border-top: 1px solid var(--border); padding: 0.8rem 0; }
  .step:first-of-type { border-top: none; padding-top: 0; }
  .step:last-child { padding-bottom: 0; }
  .step-head { display: flex; align-items: baseline; gap: 0.6rem; flex-wrap: wrap; }
  .step-name { font-weight: 700; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .muted { color: var(--text-muted); font-size: 0.8rem; }
  .label { color: var(--text-muted); font-size: 0.78rem; margin-top: 0.55rem; text-transform: uppercase; letter-spacing: 0.04em; }
  .badge { font-size: 0.72rem; font-weight: 700; padding: 0.1rem 0.45rem; border-radius: 999px; color: #fff; }
  .badge.ok { background: var(--ok); }
  .badge.err { background: var(--err); }
  .tool-desc { margin: 0.35rem 0 0; font-size: 0.9rem; line-height: 1.5; }
  details summary { cursor: pointer; font-size: 0.8rem; color: var(--text-muted); margin-top: 0.4rem; }

  #answer { font-size: 1rem; line-height: 1.6; white-space: pre-wrap; overflow-wrap: anywhere; }
  .empty { color: var(--text-muted); font-size: 0.92rem; }
  .hidden { display: none; }
</style>
</head>
<body>
  <header>
    <h1>First MCP Tool</h1>
    <p>An agent that answers with <code>list_recent_commits</code>, a GitHub tool served over MCP.</p>
  </header>

  <section class="card">
    <h2>Ask the agent</h2>
    <textarea id="question" spellcheck="false" placeholder="What changed in CaptainDmitro/AI-Advent-Challenge this week?"></textarea>
    <div class="examples" id="examples"></div>
    <div class="actions">
      <span class="hint" id="hint"></span>
      <button id="ask" type="button">Ask</button>
    </div>
  </section>

  <section class="card">
    <h2>1 · MCP server &amp; tools</h2>
    <div id="mcp"><div class="empty">The agent connects and runs <code>tools/list</code> on every question.</div></div>
  </section>

  <section class="card">
    <h2 id="calls-title">2 · Tool calls</h2>
    <div id="calls"><div class="empty">No tool calls yet.</div></div>
  </section>

  <section class="card">
    <h2>3 · Answer</h2>
    <div class="status hidden" id="status"><span class="dot"></span><span class="msg"></span></div>
    <div id="answer" class="empty">Ask something to see the agent use the tool's result.</div>
  </section>

<script>
const EXAMPLES = [
  'What changed in CaptainDmitro/AI-Advent-Challenge this week?',
  'Кто последним менял README.md в tokio-rs/axum и что именно?',
  'Summarize the last 5 commits of modelcontextprotocol/rust-sdk',
  'Show recent commits of octocat/this-repo-does-not-exist',
];

const questionEl = document.getElementById('question');
const askButton = document.getElementById('ask');
const hintEl = document.getElementById('hint');
const mcpEl = document.getElementById('mcp');
const callsEl = document.getElementById('calls');
const callsTitleEl = document.getElementById('calls-title');
const statusEl = document.getElementById('status');
const answerEl = document.getElementById('answer');

function el(tag, attrs = {}, text) {
  const node = document.createElement(tag);
  Object.assign(node, attrs);
  if (text !== undefined) node.textContent = text;
  return node;
}

function setStatus(kind, message) {
  statusEl.className = `status ${kind}`;
  statusEl.querySelector('.msg').textContent = message;
}

function json(value) {
  return JSON.stringify(value, null, 2);
}

function renderMcp(mcp) {
  if (!mcp) {
    mcpEl.replaceChildren(el('div', { className: 'empty' }, 'Not connected - see the error below.'));
    return;
  }
  const meta = el('dl', { className: 'meta' });
  [['Endpoint', mcp.url], ['Server', mcp.server || '(not reported)'], ['Tools', String(mcp.tools.length)]]
    .forEach(([k, v]) => meta.append(el('dt', {}, k), el('dd', {}, v)));

  const tools = mcp.tools.map((tool) => {
    const props = Object.keys(tool.input_schema?.properties || {});
    const required = new Set(tool.input_schema?.required || []);
    const head = el('div', { className: 'step-head' });
    head.append(
      el('span', { className: 'step-name' }, tool.name),
      el('span', { className: 'muted' }, `(${props.map((p) => required.has(p) ? p : `${p}?`).join(', ')})`),
    );
    const details = el('details');
    details.append(el('summary', {}, 'Input schema'), el('pre', {}, json(tool.input_schema)));
    const block = el('div', { className: 'step' });
    block.append(head, el('p', { className: 'tool-desc' }, tool.description || '(no description)'), details);
    return block;
  });
  mcpEl.replaceChildren(meta, ...tools);
}

function renderCalls(calls) {
  callsTitleEl.textContent = `2 · Tool calls (${calls.length})`;
  if (calls.length === 0) {
    callsEl.replaceChildren(el('div', { className: 'empty' }, 'The model answered without calling a tool.'));
    return;
  }
  callsEl.replaceChildren(...calls.map((call) => {
    const head = el('div', { className: 'step-head' });
    head.append(
      el('span', { className: 'step-name' }, `tools/call ${call.name}`),
      el('span', { className: `badge ${call.is_error ? 'err' : 'ok'}` }, call.is_error ? 'isError' : 'ok'),
      el('span', { className: 'muted' }, `round ${call.round} · ${call.ms} ms`),
    );
    const block = el('div', { className: 'step' });
    block.append(
      head,
      el('div', { className: 'label' }, 'Arguments (chosen by the LLM)'),
      el('pre', {}, json(call.arguments)),
      el('div', { className: 'label' }, 'Result (sent back to the LLM)'),
      el('pre', {}, call.result_text),
    );
    if (call.structured) {
      const details = el('details');
      details.append(el('summary', {}, 'structuredContent'), el('pre', {}, json(call.structured)));
      block.append(details);
    }
    return block;
  }));
}

async function ask() {
  const question = questionEl.value.trim() || questionEl.placeholder;
  questionEl.value = question;
  askButton.disabled = true;
  mcpEl.replaceChildren(el('div', { className: 'empty' }, 'Connecting (initialize → tools/list)...'));
  callsTitleEl.textContent = '2 · Tool calls';
  callsEl.replaceChildren(el('div', { className: 'empty' }, 'Waiting for the model...'));
  answerEl.className = 'empty';
  answerEl.textContent = '';
  setStatus('pending', 'Thinking...');

  try {
    const res = await fetch('/api/ask', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question }),
    });
    if (!res.ok) throw new Error(`request failed with status ${res.status}`);
    const run = await res.json();
    renderMcp(run.mcp);
    renderCalls(run.tool_calls || []);
    if (run.error) {
      setStatus('err', run.error);
      return;
    }
    const n = run.tool_calls.length;
    setStatus('ok', `Answered after ${n} tool call${n === 1 ? '' : 's'} · ${run.llm_rounds} LLM round${run.llm_rounds === 1 ? '' : 's'}`);
    answerEl.className = '';
    answerEl.textContent = run.answer;
  } catch (e) {
    setStatus('err', `Error: ${e.message || e}`);
  } finally {
    askButton.disabled = false;
  }
}

EXAMPLES.forEach((text) => {
  const chip = el('button', { type: 'button', className: 'chip' }, text);
  chip.addEventListener('click', () => { questionEl.value = text; ask(); });
  document.getElementById('examples').append(chip);
});
askButton.addEventListener('click', ask);
questionEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) ask();
});

fetch('/api/config')
  .then((r) => r.json())
  .then((cfg) => { hintEl.textContent = `MCP: ${cfg.mcp_url} · model: ${cfg.model}`; })
  .catch(() => {});
</script>
</body>
</html>
