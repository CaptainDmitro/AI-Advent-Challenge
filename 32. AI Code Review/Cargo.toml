[package]
name = "ai-code-review"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
# rustls keeps the musl build static.
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
# Lesson 31's rmcp setup: the server half is the `project` MCP server over
# the PR's head, and the client half is how the reviewer connects to it.
rmcp = { version = "3.4.1", default-features = false, features = [
    "server",
    "macros",
    "transport-streamable-http-server",
    "client",
    "transport-streamable-http-client-reqwest",
    "reqwest",
] }
schemars = "1.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "process", "sync", "time"] }
