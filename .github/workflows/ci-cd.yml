name: CI/CD

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      lessons:
        description: 'Comma-separated lesson numbers to deploy (e.g. 03,06), or "all". Leave empty to deploy only the latest lesson.'
        required: false
        type: string

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      all: ${{ steps.scan.outputs.all }}
      web: ${{ steps.scan.outputs.web }}
      deploy: ${{ steps.scan.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4

      - name: Find lesson crates and pick deploy targets
        id: scan
        env:
          LESSONS_INPUT: ${{ github.event.inputs.lessons }}
        run: |
          set -euo pipefail
          mapfile -t dirs < <(find . -maxdepth 2 -name Cargo.toml -exec dirname {} \; | sed 's|^\./||' | sort)

          all_json=$(printf '%s\n' "${dirs[@]}" | jq -R -s -c 'split("\n") | map(select(length > 0))')

          # Every lesson dir that's a web app (depends on axum).
          web_dirs=()
          for d in "${dirs[@]}"; do
            if grep -qE '^axum( |=)' "$d/Cargo.toml"; then
              web_dirs+=("$d")
            fi
          done
          web_json=$(printf '%s\n' "${web_dirs[@]:-}" | jq -R -s -c 'split("\n") | map(select(length > 0))')

          # The highest-numbered lesson folder overall ("today's lesson"),
          # since `dirs` is already sorted and folder names are zero-padded.
          latest_dir="${dirs[-1]}"
          latest_nn=$(basename "$latest_dir" | grep -oE '^[0-9]+')

          nn_of() { basename "$1" | grep -oE '^[0-9]+'; }

          selected=()
          if [ -n "${LESSONS_INPUT:-}" ]; then
            if [ "$LESSONS_INPUT" = "all" ]; then
              selected=("${web_dirs[@]:-}")
            else
              IFS=',' read -ra wanted <<< "$LESSONS_INPUT"
              for raw in "${wanted[@]}"; do
                trimmed=$(echo "$raw" | tr -d '[:space:]')
                [ -z "$trimmed" ] && continue
                padded=$(printf '%02d' "$((10#$trimmed))")
                for d in "${web_dirs[@]:-}"; do
                  if [ "$(nn_of "$d")" = "$padded" ]; then
                    selected+=("$d")
                  fi
                done
              done
            fi
          else
            for d in "${web_dirs[@]:-}"; do
              if [ "$(nn_of "$d")" = "$latest_nn" ]; then
                selected+=("$d")
              fi
            done
          fi
          deploy_json=$(printf '%s\n' "${selected[@]:-}" | jq -R -s -c 'split("\n") | map(select(length > 0))')

          echo "all=$all_json" >> "$GITHUB_OUTPUT"
          echo "web=$web_json" >> "$GITHUB_OUTPUT"
          echo "deploy=$deploy_json" >> "$GITHUB_OUTPUT"
          echo "All crates: $all_json"
          echo "Web (deployable) crates: $web_json"
          echo "Latest lesson: $latest_dir"
          echo "Deploy targets this run: $deploy_json"

  build-test:
    needs: discover
    if: needs.discover.outputs.all != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJSON(needs.discover.outputs.all) }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.dir }}

      # Non-blocking: several lessons predate this pipeline and were never run
      # through rustfmt/clippy. Surface issues without failing already-finished,
      # already-recorded lessons on style alone.
      - name: cargo fmt --check
        working-directory: ${{ matrix.dir }}
        continue-on-error: true
        run: cargo fmt --check

      - name: cargo clippy
        working-directory: ${{ matrix.dir }}
        continue-on-error: true
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo build --release
        working-directory: ${{ matrix.dir }}
        run: cargo build --release

      - name: cargo test
        working-directory: ${{ matrix.dir }}
        run: cargo test

  deploy:
    needs: [discover, build-test]
    if: needs.discover.outputs.deploy != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJSON(needs.discover.outputs.deploy) }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install musl build tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.dir }}
          key: musl

      - name: cargo build --release --target musl
        working-directory: ${{ matrix.dir }}
        run: cargo build --release --target x86_64-unknown-linux-musl

      - name: Compute lesson metadata
        id: meta
        run: |
          set -euo pipefail
          dir="${{ matrix.dir }}"
          nn=$(basename "$dir" | grep -oE '^[0-9]+')
          port=$((10#$nn + 4000))
          bin=$(awk -F'"' '/^name *=/{print $2; exit}' "$dir/Cargo.toml")
          {
            echo "nn=$nn"
            echo "port=$port"
            echo "service=ai-advent-lesson-$nn"
            echo "bin=$bin"
          } >> "$GITHUB_OUTPUT"

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VDS_SSH_KEY }}
          VDS_HOST: ${{ vars.VDS_HOST }}
        run: |
          set -euo pipefail
          : "${SSH_KEY:?VDS_SSH_KEY secret is empty}"
          : "${VDS_HOST:?VDS_HOST repository variable is empty}"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$VDS_HOST" >> ~/.ssh/known_hosts

      - name: Upload binary
        run: |
          set -euo pipefail
          dir="${{ matrix.dir }}"
          nn="${{ steps.meta.outputs.nn }}"
          bin="${{ steps.meta.outputs.bin }}"
          remote="${{ vars.VDS_USER }}@${{ vars.VDS_HOST }}"
          app_dir="apps/lesson-$nn"

          ssh -i ~/.ssh/deploy_key "$remote" "mkdir -p $app_dir"
          scp -i ~/.ssh/deploy_key "$dir/target/x86_64-unknown-linux-musl/release/$bin" "$remote:$app_dir/app.new"
          ssh -i ~/.ssh/deploy_key "$remote" "chmod +x $app_dir/app.new && mv $app_dir/app.new $app_dir/app"

      - name: Configure environment and systemd unit
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        run: |
          set -euo pipefail
          nn="${{ steps.meta.outputs.nn }}"
          port="${{ steps.meta.outputs.port }}"
          service="${{ steps.meta.outputs.service }}"
          remote="${{ vars.VDS_USER }}@${{ vars.VDS_HOST }}"
          app_dir="apps/lesson-$nn"

          env_content="PORT=$port
          OPENAI_API_KEY=$OPENAI_API_KEY"
          if [ -n "$OPENAI_BASE_URL" ]; then
            env_content="$env_content
          OPENAI_BASE_URL=$OPENAI_BASE_URL"
          fi
          if [ -n "$OPENAI_MODEL" ]; then
            env_content="$env_content
          OPENAI_MODEL=$OPENAI_MODEL"
          fi
          ssh -i ~/.ssh/deploy_key "$remote" "cat > $app_dir/.env" <<< "$env_content"

          ssh -i ~/.ssh/deploy_key "$remote" "mkdir -p ~/.config/systemd/user && cat > ~/.config/systemd/user/$service.service" <<UNIT_EOF
          [Unit]
          Description=AI Advent Challenge lesson $nn
          After=network.target

          [Service]
          WorkingDirectory=%h/$app_dir
          EnvironmentFile=%h/$app_dir/.env
          ExecStart=%h/$app_dir/app
          Restart=on-failure

          [Install]
          WantedBy=default.target
          UNIT_EOF

          remote_cmd='export XDG_RUNTIME_DIR=/run/user/$(id -u); systemctl --user daemon-reload && systemctl --user enable '"$service"' && systemctl --user restart '"$service"
          ssh -i ~/.ssh/deploy_key "$remote" "$remote_cmd"

      - name: Verify service is up
        run: |
          set -euo pipefail
          port="${{ steps.meta.outputs.port }}"
          remote="${{ vars.VDS_USER }}@${{ vars.VDS_HOST }}"
          service="${{ steps.meta.outputs.service }}"

          for i in 1 2 3 4 5; do
            sleep 2
            remote_cmd='export XDG_RUNTIME_DIR=/run/user/$(id -u); systemctl --user is-active '"$service"
            if ssh -i ~/.ssh/deploy_key "$remote" "$remote_cmd" | grep -q '^active$'; then
              echo "Service $service is active."
              exit 0
            fi
          done
          echo "Service $service did not become active in time." >&2
          remote_cmd='export XDG_RUNTIME_DIR=/run/user/$(id -u); systemctl --user status '"$service"' --no-pager -l'
          ssh -i ~/.ssh/deploy_key "$remote" "$remote_cmd" || true
          exit 1
