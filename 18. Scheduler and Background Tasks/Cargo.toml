[package]
name = "scheduler-background-tasks"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "query", "rustls"] }
# Same rmcp setup as lesson 17: the server half serves the scheduler tools at
# `/mcp`, and the client half is how the agent (chat and the periodic digest)
# reaches them over Streamable HTTP. rustls keeps the musl build static.
rmcp = { version = "3.4.1", default-features = false, features = [
    "server",
    "macros",
    "transport-streamable-http-server",
    "client",
    "transport-streamable-http-client-reqwest",
    "reqwest",
] }
schemars = "1.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# `sync` for the scheduler's tick lock, `time` for its interval loop.
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "sync"] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "sync", "io-util"] }
