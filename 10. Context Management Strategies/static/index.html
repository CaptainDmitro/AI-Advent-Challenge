<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Context Management Strategies</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f6f8;
    --surface: #ffffff;
    --border: #e2e4e9;
    --text: #1a1d23;
    --text-muted: #6b7280;
    --primary: #4f46e5;
    --primary-hover: #4338ca;
    --code-bg: #f0f1f4;
    --shadow: 0 1px 2px rgba(16, 24, 40, 0.06), 0 1px 3px rgba(16, 24, 40, 0.08);
    --bubble-user: #4f46e5;
    --bubble-user-text: #ffffff;
    --bubble-assistant: #ffffff;
    --savings: #059669;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a;
      --surface: #1c1f26;
      --border: #2c3038;
      --text: #e7e9ec;
      --text-muted: #9aa1ac;
      --primary: #6366f1;
      --primary-hover: #7c7ff2;
      --code-bg: #262a33;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 2px 6px rgba(0, 0, 0, 0.35);
      --bubble-user: #6366f1;
      --bubble-user-text: #ffffff;
      --bubble-assistant: #1c1f26;
      --savings: #34d399;
    }
  }

  * { box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    max-width: 760px;
    margin: 0 auto;
    padding: 2.5rem 1.5rem 2rem;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }

  header { text-align: center; margin-bottom: 1rem; flex: none; }
  h1 {
    font-size: 1.7rem;
    font-weight: 700;
    margin: 0 0 0.4rem;
    letter-spacing: -0.01em;
  }
  header p {
    color: var(--text-muted);
    margin: 0;
    font-size: 0.98rem;
  }

  .stats-bar {
    flex: none;
    font-size: 0.78rem;
    color: var(--text-muted);
    text-align: center;
    margin-bottom: 0.4rem;
    min-height: 1rem;
  }
  .stats-bar .saved {
    color: var(--savings);
    font-weight: 600;
  }

  .panel {
    flex: none;
    margin-bottom: 0.5rem;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    box-shadow: var(--shadow);
  }
  .panel summary {
    cursor: pointer;
    list-style: none;
    padding: 0.5rem 0.9rem;
    font-size: 0.82rem;
    font-weight: 600;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.5rem;
  }
  .panel summary::-webkit-details-marker { display: none; }
  .panel summary::before { content: '▸ '; }
  .panel[open] summary::before { content: '▾ '; }
  .panel-body {
    padding: 0 0.9rem 0.8rem;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }

  .facts-table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
  .facts-table td { padding: 0.3rem 0.4rem; border-bottom: 1px solid var(--border); vertical-align: top; }
  .facts-table td.key { color: var(--text-muted); font-weight: 600; white-space: nowrap; padding-right: 0.8rem; }
  .facts-empty, .branch-empty {
    font-size: 0.82rem;
    color: var(--text-muted);
    font-style: italic;
  }

  .branch-list { display: flex; flex-direction: column; gap: 0.4rem; }
  .branch-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.5rem;
    padding: 0.4rem 0.6rem;
    border-radius: 8px;
    border: 1px solid var(--border);
    font-size: 0.82rem;
  }
  .branch-item.active { border-color: var(--primary); background: rgba(79, 70, 229, 0.08); }
  .branch-item .branch-name { font-weight: 600; }
  .branch-item .branch-meta { color: var(--text-muted); font-size: 0.74rem; margin-top: 0.1rem; }
  .branch-item button {
    background: transparent;
    color: var(--primary);
    border: 1px solid var(--primary);
    padding: 0.25rem 0.6rem;
    font-size: 0.76rem;
    flex: none;
  }
  .branch-item button:hover:not(:disabled) { background: var(--primary); color: #fff; }

  .branch-controls {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
    margin-top: 0.4rem;
    padding-top: 0.5rem;
    border-top: 1px solid var(--border);
  }
  .branch-controls .row { display: flex; gap: 0.4rem; align-items: center; flex-wrap: wrap; }
  .branch-controls input[type="text"], .branch-controls select {
    font-family: inherit;
    font-size: 0.8rem;
    color: var(--text);
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.35rem 0.5rem;
    flex: 1;
    min-width: 8rem;
  }
  .branch-controls button {
    font-size: 0.78rem;
    padding: 0.35rem 0.8rem;
    background: var(--primary);
    color: #fff;
    flex: none;
  }
  .branch-controls button:hover:not(:disabled) { background: var(--primary-hover); }

  .limit-warning {
    flex: none;
    font-size: 0.8rem;
    text-align: center;
    padding: 0.5rem 0.8rem;
    border-radius: 10px;
    margin-bottom: 0.6rem;
    background: rgba(217, 119, 6, 0.12);
    color: #b45309;
    border: 1px solid rgba(217, 119, 6, 0.35);
  }
  .limit-warning.over {
    background: rgba(220, 38, 38, 0.12);
    color: #dc2626;
    border-color: rgba(220, 38, 38, 0.35);
  }

  .chat {
    flex: 1;
    overflow-y: auto;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: var(--shadow);
    padding: 1.25rem;
    display: flex;
    flex-direction: column;
    gap: 0.9rem;
    min-height: 0;
  }

  .empty-state {
    margin: auto;
    color: var(--text-muted);
    text-align: center;
    font-size: 0.95rem;
  }

  .bubble-row { display: flex; }
  .bubble-row.user { justify-content: flex-end; }
  .bubble-row.assistant { justify-content: flex-start; }

  .bubble-wrap {
    display: flex;
    flex-direction: column;
    max-width: 78%;
    gap: 0.25rem;
  }
  .bubble-row.user .bubble-wrap { align-items: flex-end; }
  .bubble-row.assistant .bubble-wrap { align-items: flex-start; }

  .token-caption {
    font-size: 0.72rem;
    color: var(--text-muted);
    padding: 0 0.2rem;
  }

  .bubble {
    padding: 0.65rem 0.95rem;
    border-radius: 14px;
    font-size: 0.95rem;
    line-height: 1.5;
    white-space: pre-wrap;
    overflow-wrap: break-word;
  }
  .bubble-row.user .bubble {
    background: var(--bubble-user);
    color: var(--bubble-user-text);
    border-bottom-right-radius: 4px;
  }
  .bubble-row.assistant .bubble {
    background: var(--bubble-assistant);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }
  .bubble-row.assistant .bubble.error {
    color: #dc2626;
  }
  .bubble-row.assistant .bubble.loading {
    color: var(--text-muted);
    font-style: italic;
    animation: pulse 1.3s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.5; }
    50% { opacity: 1; }
  }

  .bubble code {
    background: var(--code-bg);
    padding: 0.1em 0.35em;
    border-radius: 4px;
    font-size: 0.88em;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  .bubble pre {
    background: var(--code-bg);
    padding: 0.75em;
    border-radius: 8px;
    overflow-x: auto;
    margin: 0.4em 0;
    white-space: pre;
  }
  .bubble pre code { background: none; padding: 0; }
  .bubble h4, .bubble h5, .bubble h6 {
    margin: 0.6em 0 0.3em;
    font-size: 1em;
    line-height: 1.3;
    font-weight: 700;
  }
  .bubble h4:first-child, .bubble h5:first-child, .bubble h6:first-child { margin-top: 0; }

  .composer {
    flex: none;
    margin-top: 1rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: var(--shadow);
    padding: 0.9rem 1rem;
  }

  textarea#prompt {
    width: 100%;
    height: 3rem;
    font-family: inherit;
    font-size: 1rem;
    color: var(--text);
    background: transparent;
    border: none;
    outline: none;
    resize: none;
  }
  textarea#prompt::placeholder { color: var(--text-muted); }

  .composer-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 0.6rem;
  }

  .composer-footer .hint {
    font-size: 0.78rem;
    color: var(--text-muted);
  }

  .composer-footer .actions { display: flex; gap: 0.6rem; }

  .toggle-row {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    margin-top: 0.75rem;
    padding-top: 0.75rem;
    border-top: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .toggle-row .toggle-label {
    font-size: 0.8rem;
    color: var(--text-muted);
  }
  .toggle-group { display: flex; gap: 0.3rem; flex-wrap: wrap; }
  .toggle-group button {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-muted);
    padding: 0.3rem 0.7rem;
    font-size: 0.82rem;
    font-weight: 600;
    border-radius: 7px;
  }
  .toggle-group button.active {
    background: var(--primary);
    border-color: var(--primary);
    color: #fff;
  }
  .toggle-spacer { flex: 1; }

  details.advanced {
    margin-top: 0.6rem;
    border-top: 1px solid var(--border);
    padding-top: 0.6rem;
  }
  details.advanced summary {
    cursor: pointer;
    font-size: 0.82rem;
    font-weight: 600;
    color: var(--text-muted);
    list-style: none;
  }
  details.advanced summary::-webkit-details-marker { display: none; }
  details.advanced summary::before {
    content: '▸ ';
  }
  details.advanced[open] summary::before {
    content: '▾ ';
  }
  .advanced-body {
    display: flex;
    flex-direction: column;
    gap: 0.7rem;
    margin-top: 0.7rem;
  }
  .slider-row, .field-row {
    display: flex;
    align-items: center;
    gap: 0.6rem;
  }
  .slider-row label, .field-row label {
    font-size: 0.8rem;
    color: var(--text-muted);
    width: 6.5rem;
    flex: none;
  }
  .slider-row input[type="range"] {
    flex: 1;
    accent-color: var(--primary);
  }
  .slider-row .range-label {
    font-size: 0.78rem;
    color: var(--text-muted);
    width: 2rem;
    text-align: right;
  }
  .field-row input[type="number"] {
    width: 7rem;
  }
  .stop-row { align-items: flex-start; }
  .stop-inputs {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.4rem;
    flex: 1;
  }
  input[type="number"], input[type="text"].stop-input {
    font-family: inherit;
    font-size: 0.85rem;
    color: var(--text);
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.35rem 0.5rem;
  }
  #advanced-reset {
    align-self: flex-start;
    background: transparent;
    color: var(--text-muted);
    border: 1px solid var(--border);
    padding: 0.35rem 0.8rem;
    font-size: 0.78rem;
  }
  #advanced-reset:hover { color: var(--text); border-color: var(--text-muted); }

  button {
    border: none;
    border-radius: 9px;
    padding: 0.55rem 1.2rem;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.05s ease;
  }
  button:active:not(:disabled) { transform: scale(0.98); }
  button:disabled { opacity: 0.55; cursor: not-allowed; }

  button#send {
    background: var(--primary);
    color: #fff;
  }
  button#send:hover:not(:disabled) { background: var(--primary-hover); }

  button#reset {
    background: transparent;
    color: var(--text-muted);
    border: 1px solid var(--border);
  }
  button#reset:hover:not(:disabled) { color: var(--text); border-color: var(--text-muted); }
</style>
</head>
<body>
  <header>
    <h1>Context Management Strategies</h1>
    <p>Sliding window, sticky facts, or branching checkpoints — same scenario, three ways to keep context under control.</p>
  </header>

  <div class="stats-bar" id="stats-bar"></div>

  <details class="panel" id="facts-panel">
    <summary>
      <span>Sticky facts</span>
      <span id="facts-meta-inline"></span>
    </summary>
    <div class="panel-body" id="facts-body">
      <div class="facts-empty">No facts captured yet.</div>
    </div>
  </details>

  <details class="panel" id="branches-panel">
    <summary>
      <span>Branches &amp; checkpoints</span>
      <span id="branches-meta-inline"></span>
    </summary>
    <div class="panel-body">
      <div class="branch-list" id="branch-list"></div>
      <div class="branch-controls">
        <div class="row">
          <input type="text" id="checkpoint-label" placeholder="Checkpoint label (e.g. &quot;scope agreed&quot;)">
          <button type="button" id="save-checkpoint">Save checkpoint</button>
        </div>
        <div class="row">
          <select id="checkpoint-select" disabled><option value="">No checkpoints yet</option></select>
          <input type="text" id="fork-name" placeholder="New branch name">
          <button type="button" id="fork-branch" disabled>Fork</button>
        </div>
      </div>
    </div>
  </details>

  <div class="limit-warning" id="limit-warning" hidden></div>

  <div class="chat" id="chat">
    <div class="empty-state" id="empty-state">Loading conversation...</div>
  </div>

  <div class="composer">
    <textarea id="prompt" placeholder="Ask the agent something..."></textarea>

    <div class="toggle-row">
      <span class="toggle-label">Model</span>
      <div class="toggle-group" id="model-toggle">
        <button type="button" class="active" data-model="deepseek-v4-flash">⚡ Flash</button>
        <button type="button" data-model="deepseek-v4-pro">🧠 Pro</button>
      </div>
      <span class="toggle-spacer"></span>
      <span class="toggle-label">Strategy</span>
      <div class="toggle-group" id="strategy-toggle">
        <button type="button" class="active" data-strategy="sliding_window">Sliding Window</button>
        <button type="button" data-strategy="sticky_facts">Sticky Facts</button>
        <button type="button" data-strategy="branching">Branching</button>
      </div>
    </div>

    <details class="advanced">
      <summary>Advanced</summary>
      <div class="advanced-body">
        <div class="slider-row">
          <label for="temperature">Temperature</label>
          <input type="range" id="temperature" min="0" max="2" step="0.1" value="1">
          <span class="range-label" id="temperature-value">1.0</span>
        </div>
        <div class="field-row">
          <label for="max-tokens">Max tokens</label>
          <input type="number" id="max-tokens" min="1" placeholder="no limit">
        </div>
        <div class="field-row stop-row">
          <label>Stop sequences</label>
          <div class="stop-inputs">
            <input type="text" class="stop-input" placeholder="Stop 1">
            <input type="text" class="stop-input" placeholder="Stop 2">
            <input type="text" class="stop-input" placeholder="Stop 3">
            <input type="text" class="stop-input" placeholder="Stop 4">
          </div>
        </div>
        <button id="advanced-reset" type="button">Reset advanced settings</button>
      </div>
    </details>

    <div class="composer-footer">
      <span class="hint">Enter to send &middot; Shift+Enter for a new line</span>
      <div class="actions">
        <button id="reset" type="button">Reset</button>
        <button id="send" type="button">Send</button>
      </div>
    </div>
  </div>

<script>
const chatEl = document.getElementById('chat');
let emptyState = document.getElementById('empty-state');
const promptEl = document.getElementById('prompt');
const sendButton = document.getElementById('send');
const resetButton = document.getElementById('reset');
const statsBar = document.getElementById('stats-bar');
const limitWarning = document.getElementById('limit-warning');

const factsBody = document.getElementById('facts-body');
const factsMetaInline = document.getElementById('facts-meta-inline');

const branchList = document.getElementById('branch-list');
const branchesMetaInline = document.getElementById('branches-meta-inline');
const checkpointLabelInput = document.getElementById('checkpoint-label');
const saveCheckpointButton = document.getElementById('save-checkpoint');
const checkpointSelect = document.getElementById('checkpoint-select');
const forkNameInput = document.getElementById('fork-name');
const forkButton = document.getElementById('fork-branch');

let keepLastN = null;

const modelToggle = document.getElementById('model-toggle');
let selectedModel = 'deepseek-v4-flash';
modelToggle.addEventListener('click', (e) => {
  const button = e.target.closest('button[data-model]');
  if (!button) return;
  selectedModel = button.dataset.model;
  modelToggle.querySelectorAll('button').forEach((b) => b.classList.toggle('active', b === button));
});

const strategyLabels = {
  sliding_window: 'Sliding Window',
  sticky_facts: 'Sticky Facts',
  branching: 'Branching',
};
function strategyLabel(s) {
  return strategyLabels[s] || s;
}

const strategyToggle = document.getElementById('strategy-toggle');
let selectedStrategy = 'sliding_window';

function syncStrategyToggle(strategy) {
  selectedStrategy = strategy;
  strategyToggle.querySelectorAll('button').forEach((b) => b.classList.toggle('active', b.dataset.strategy === strategy));
}

strategyToggle.addEventListener('click', async (e) => {
  const button = e.target.closest('button[data-strategy]');
  if (!button) return;
  syncStrategyToggle(button.dataset.strategy);
  try {
    await fetch('/api/strategy', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ strategy: selectedStrategy }),
    });
  } catch (err) {
    // Best-effort - the next /api/chat call still carries the strategy explicitly.
  }
});

const temperatureEl = document.getElementById('temperature');
const temperatureValueEl = document.getElementById('temperature-value');
const maxTokensEl = document.getElementById('max-tokens');
const stopInputs = Array.from(document.querySelectorAll('.stop-input'));
const advancedResetButton = document.getElementById('advanced-reset');

temperatureEl.addEventListener('input', () => {
  temperatureValueEl.textContent = parseFloat(temperatureEl.value).toFixed(1);
});

advancedResetButton.addEventListener('click', () => {
  temperatureEl.value = '1';
  temperatureValueEl.textContent = '1.0';
  maxTokensEl.value = '';
  stopInputs.forEach((input) => { input.value = ''; });
});

// Collects the current advanced settings into the shape /api/chat expects.
// max_tokens/stop are only included when actually set - an empty control
// means "let the API use its own default", not "send an empty value".
function chatOptions() {
  const options = {
    model: selectedModel,
    temperature: parseFloat(temperatureEl.value),
    strategy: selectedStrategy,
  };

  const maxTokens = parseInt(maxTokensEl.value, 10);
  if (!Number.isNaN(maxTokens)) {
    options.max_tokens = maxTokens;
  }

  const stop = stopInputs.map((input) => input.value.trim()).filter((v) => v.length > 0);
  if (stop.length > 0) {
    options.stop = stop;
  }

  return options;
}

function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// Minimal, dependency-free markdown covering what LLM replies typically use:
// fenced/inline code, headings, and bold/italic. Line breaks are preserved
// by the bubble's `white-space: pre-wrap`, so no paragraph/list handling is
// needed here - but headings need an actual tag, since a literal "###" left
// in the text just reads as clutter rather than a heading.
function renderMarkdown(raw) {
  const codeBlocks = [];
  let text = raw.replace(/```(?:\w*)\n?([\s\S]*?)```/g, (_, code) => {
    codeBlocks.push(`<pre><code>${escapeHtml(code.replace(/\n$/, ''))}</code></pre>`);
    return ` ${codeBlocks.length - 1} `;
  });

  text = escapeHtml(text);
  text = text.replace(/^(#{1,6})\s+(.*)$/gm, (_, hashes, content) => {
    const level = Math.min(hashes.length, 3) + 3; // # -> h4, ## -> h5, ###+ -> h6
    return `<h${level}>${content}</h${level}>`;
  });
  text = text.replace(/`([^`]+)`/g, (_, code) => `<code>${code}</code>`);
  text = text.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  text = text.replace(/(^|[^*\w])\*([^*\n]+)\*(?!\*)/g, '$1<em>$2</em>');

  return text.replace(/ (\d+) /g, (_, i) => codeBlocks[i]);
}

function clearEmptyState(message) {
  if (emptyState) {
    emptyState.remove();
    emptyState = null;
  }
  if (message && chatEl.children.length === 0) {
    emptyState = document.createElement('div');
    emptyState.className = 'empty-state';
    chatEl.appendChild(emptyState);
    emptyState.textContent = message;
  }
}

function addBubble(role, text, { loading = false, caption = null } = {}) {
  clearEmptyState();
  const row = document.createElement('div');
  row.className = `bubble-row ${role}`;
  const wrap = document.createElement('div');
  wrap.className = 'bubble-wrap';
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  if (loading) {
    bubble.classList.add('loading');
    bubble.textContent = text;
  } else if (role === 'assistant') {
    bubble.innerHTML = renderMarkdown(text);
  } else {
    bubble.textContent = text;
  }
  wrap.appendChild(bubble);
  if (caption) {
    const capEl = document.createElement('div');
    capEl.className = 'token-caption';
    capEl.textContent = caption;
    wrap.appendChild(capEl);
  }
  row.appendChild(wrap);
  chatEl.appendChild(row);
  chatEl.scrollTop = chatEl.scrollHeight;
  return bubble;
}

function tokenCaption(tokens) {
  if (!tokens) return null;
  const mode = strategyLabel(tokens.strategy);
  if (tokens.actual) {
    return `${tokens.actual.prompt_tokens} prompt / ${tokens.actual.completion_tokens} completion / ${tokens.actual.total_tokens} total tok (actual, ${mode})`;
  }
  return `~${tokens.sent_context_tokens} prompt / ~${tokens.estimated_response_tokens} completion tok (estimated, ${mode})`;
}

function updateStats(tokens) {
  if (!tokens) return;

  const parts = [];
  parts.push(`Strategy: <strong>${strategyLabel(tokens.strategy)}</strong>`);
  parts.push(`Branch: ${escapeHtml(tokens.branch_name || tokens.branch_id)}`);
  parts.push(`Sent: ${tokens.sent_context_tokens.toLocaleString()} tok`);
  parts.push(`No-strategy baseline: ${tokens.uncompacted_context_tokens.toLocaleString()} tok`);
  if (tokens.tokens_saved_this_turn > 0) {
    const pct = tokens.uncompacted_context_tokens > 0
      ? (tokens.tokens_saved_this_turn / tokens.uncompacted_context_tokens * 100)
      : 0;
    parts.push(`<span class="saved">Saved ${tokens.tokens_saved_this_turn.toLocaleString()} tok (${pct.toFixed(0)}%)</span>`);
  }
  parts.push(`Raw history: ${tokens.raw_history_tokens_after.toLocaleString()} tok`);
  if (keepLastN) {
    parts.push(`Keep last ${keepLastN}`);
  }
  parts.push(`~${tokens.percent_of_limit.toFixed(1)}% of ${tokens.context_limit.toLocaleString()} limit`);
  if (typeof tokens.estimated_cost_usd === 'number') {
    parts.push(`Turn cost: $${tokens.estimated_cost_usd.toFixed(4)}`);
  }
  statsBar.innerHTML = parts.join(' &middot; ');

  if (tokens.percent_of_limit >= 100) {
    limitWarning.hidden = false;
    limitWarning.classList.add('over');
    limitWarning.textContent = `The context actually being sent is at ${tokens.percent_of_limit.toFixed(0)}% of the configured reference limit (${tokens.context_limit.toLocaleString()} tokens) — the API may already be rejecting requests.`;
  } else if (tokens.percent_of_limit >= 80) {
    limitWarning.hidden = false;
    limitWarning.classList.remove('over');
    limitWarning.textContent = `The context actually being sent is at ${tokens.percent_of_limit.toFixed(0)}% of the configured reference limit (${tokens.context_limit.toLocaleString()} tokens).`;
  } else {
    limitWarning.hidden = true;
  }

  factsMetaInline.textContent = tokens.facts_count > 0
    ? `(${tokens.facts_count} fact${tokens.facts_count === 1 ? '' : 's'}, ~${tokens.facts_tokens} tok)`
    : '';
}

function renderFacts(facts) {
  const entries = Object.entries(facts || {});
  if (entries.length === 0) {
    factsBody.innerHTML = '<div class="facts-empty">No facts captured yet.</div>';
    return;
  }
  const rows = entries
    .map(([k, v]) => `<tr><td class="key">${escapeHtml(k)}</td><td>${escapeHtml(v)}</td></tr>`)
    .join('');
  factsBody.innerHTML = `<table class="facts-table"><tbody>${rows}</tbody></table>`;
}

async function loadFacts() {
  try {
    const res = await fetch('/api/facts');
    const data = await res.json();
    renderFacts(data);
  } catch (e) {
    // Leave whatever was last rendered in place.
  }
}

function renderBranches(branches) {
  const active = (branches || []).find((b) => b.is_active);
  branchesMetaInline.textContent = active ? `(active: ${active.name})` : '';

  if (!branches || branches.length === 0) {
    branchList.innerHTML = '<div class="branch-empty">No branches yet.</div>';
    return;
  }
  branchList.innerHTML = branches.map((b) => `
    <div class="branch-item ${b.is_active ? 'active' : ''}">
      <div>
        <div class="branch-name">${escapeHtml(b.name)}${b.is_active ? ' (active)' : ''}</div>
        <div class="branch-meta">${b.message_count} message(s)${b.parent_id ? ` &middot; forked from ${escapeHtml(b.parent_id)} at msg ${b.forked_at}` : ''}</div>
      </div>
      <button type="button" data-switch="${b.id}" ${b.is_active ? 'disabled' : ''}>Switch</button>
    </div>
  `).join('');
}

function renderCheckpoints(checkpoints) {
  if (!checkpoints || checkpoints.length === 0) {
    checkpointSelect.innerHTML = '<option value="">No checkpoints yet</option>';
    checkpointSelect.disabled = true;
    forkButton.disabled = true;
    return;
  }
  checkpointSelect.disabled = false;
  forkButton.disabled = false;
  checkpointSelect.innerHTML = checkpoints
    .map((c) => `<option value="${c.id}">${escapeHtml(c.label)} (${c.message_count} msg, ${escapeHtml(c.branch_id)})</option>`)
    .join('');
}

async function loadBranchesPanel() {
  try {
    const [branchesRes, checkpointsRes] = await Promise.all([fetch('/api/branches'), fetch('/api/checkpoints')]);
    renderBranches(await branchesRes.json());
    renderCheckpoints(await checkpointsRes.json());
  } catch (e) {
    // Leave whatever was last rendered in place.
  }
}

branchList.addEventListener('click', async (e) => {
  const button = e.target.closest('button[data-switch]');
  if (!button) return;
  button.disabled = true;
  try {
    await fetch('/api/branches/switch', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ branch_id: button.dataset.switch }),
    });
    chatEl.innerHTML = '';
    emptyState = null;
    await loadHistory();
  } finally {
    button.disabled = false;
  }
});

saveCheckpointButton.addEventListener('click', async () => {
  saveCheckpointButton.disabled = true;
  try {
    const label = checkpointLabelInput.value.trim() || 'Checkpoint';
    await fetch('/api/checkpoints', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ label }),
    });
    checkpointLabelInput.value = '';
    await loadBranchesPanel();
  } finally {
    saveCheckpointButton.disabled = false;
  }
});

forkButton.addEventListener('click', async () => {
  const checkpointId = checkpointSelect.value;
  const name = forkNameInput.value.trim();
  if (!checkpointId || !name) return;
  forkButton.disabled = true;
  try {
    const res = await fetch('/api/branches/fork', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ checkpoint_id: checkpointId, name }),
    });
    if (res.ok) {
      forkNameInput.value = '';
      await loadBranchesPanel();
    }
  } finally {
    forkButton.disabled = false;
  }
});

// Rehydrates the chat, the token stats bar, the sticky facts, and the
// branch/checkpoint lists from server-side state on load, so a page reload
// after the server restarts (or a branch switch) shows the same
// conversation and totals.
async function loadHistory() {
  try {
    const res = await fetch('/api/history');
    const data = await res.json();
    keepLastN = data.keep_last_n;
    syncStrategyToggle(data.tokens.strategy);
    updateStats(data.tokens);
    renderFacts(data.facts);
    renderBranches(data.branches);
    renderCheckpoints(data.checkpoints);
    if (data.messages && data.messages.length > 0) {
      data.messages.forEach((m) => addBubble(m.role, m.content));
      return;
    }
  } catch (e) {
    // Fall through to the empty-state message below.
  }
  clearEmptyState('Send a message to start the conversation.');
}

async function send() {
  const message = promptEl.value.trim();
  if (!message) return;

  promptEl.value = '';
  sendButton.disabled = true;

  addBubble('user', message);
  const replyBubble = addBubble('assistant', 'Thinking...', { loading: true });

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message, ...chatOptions() }),
    });
    replyBubble.classList.remove('loading');
    if (!res.ok) {
      replyBubble.classList.add('error');
      replyBubble.textContent = `Error: request failed with status ${res.status}`;
    } else {
      const data = await res.json();
      replyBubble.innerHTML = renderMarkdown(data.reply);
      const caption = tokenCaption(data.tokens);
      if (caption) {
        const capEl = document.createElement('div');
        capEl.className = 'token-caption';
        capEl.textContent = caption;
        replyBubble.parentElement.appendChild(capEl);
      }
      updateStats(data.tokens);
      loadFacts();
      loadBranchesPanel();
    }
  } catch (e) {
    replyBubble.classList.remove('loading');
    replyBubble.classList.add('error');
    replyBubble.textContent = `Error: ${e}`;
  } finally {
    sendButton.disabled = false;
    promptEl.focus();
  }
}

sendButton.addEventListener('click', send);
promptEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    send();
  }
});

resetButton.addEventListener('click', async () => {
  resetButton.disabled = true;
  try {
    await fetch('/api/reset', { method: 'POST' });
    chatEl.innerHTML = '';
    emptyState = null;
    await loadHistory();
  } finally {
    resetButton.disabled = false;
    promptEl.focus();
  }
});

loadHistory();
promptEl.focus();
</script>
</body>
</html>
