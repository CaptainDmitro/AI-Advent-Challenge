[package]
name = "project-file-assistant"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
# Search in files; pure Rust, so the musl build stays static.
regex = "1.11"
# rustls keeps the musl build static.
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
# Same rmcp setup as lessons 31 and 33: the server half is the `files` MCP
# server over the project at /mcp/files, and the client half is how the
# assistant connects to it over Streamable HTTP.
rmcp = { version = "3.4.1", default-features = false, features = [
    "server",
    "macros",
    "transport-streamable-http-server",
    "client",
    "transport-streamable-http-client-reqwest",
    "reqwest",
] }
schemars = "1.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# Unified diffs of every change.
similar = "2.6"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
