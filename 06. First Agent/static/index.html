<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>First Agent</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f6f8;
    --surface: #ffffff;
    --border: #e2e4e9;
    --text: #1a1d23;
    --text-muted: #6b7280;
    --primary: #4f46e5;
    --primary-hover: #4338ca;
    --code-bg: #f0f1f4;
    --shadow: 0 1px 2px rgba(16, 24, 40, 0.06), 0 1px 3px rgba(16, 24, 40, 0.08);
    --bubble-user: #4f46e5;
    --bubble-user-text: #ffffff;
    --bubble-assistant: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a;
      --surface: #1c1f26;
      --border: #2c3038;
      --text: #e7e9ec;
      --text-muted: #9aa1ac;
      --primary: #6366f1;
      --primary-hover: #7c7ff2;
      --code-bg: #262a33;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 2px 6px rgba(0, 0, 0, 0.35);
      --bubble-user: #6366f1;
      --bubble-user-text: #ffffff;
      --bubble-assistant: #1c1f26;
    }
  }

  * { box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    max-width: 760px;
    margin: 0 auto;
    padding: 2.5rem 1.5rem 2rem;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }

  header { text-align: center; margin-bottom: 1.5rem; flex: none; }
  h1 {
    font-size: 1.7rem;
    font-weight: 700;
    margin: 0 0 0.4rem;
    letter-spacing: -0.01em;
  }
  header p {
    color: var(--text-muted);
    margin: 0;
    font-size: 0.98rem;
  }

  .chat {
    flex: 1;
    overflow-y: auto;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: var(--shadow);
    padding: 1.25rem;
    display: flex;
    flex-direction: column;
    gap: 0.9rem;
    min-height: 0;
  }

  .empty-state {
    margin: auto;
    color: var(--text-muted);
    text-align: center;
    font-size: 0.95rem;
  }

  .bubble-row { display: flex; }
  .bubble-row.user { justify-content: flex-end; }
  .bubble-row.assistant { justify-content: flex-start; }

  .bubble {
    max-width: 78%;
    padding: 0.65rem 0.95rem;
    border-radius: 14px;
    font-size: 0.95rem;
    line-height: 1.5;
    white-space: pre-wrap;
    overflow-wrap: break-word;
  }
  .bubble-row.user .bubble {
    background: var(--bubble-user);
    color: var(--bubble-user-text);
    border-bottom-right-radius: 4px;
  }
  .bubble-row.assistant .bubble {
    background: var(--bubble-assistant);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }
  .bubble-row.assistant .bubble.error {
    color: #dc2626;
  }
  .bubble-row.assistant .bubble.loading {
    color: var(--text-muted);
    font-style: italic;
    animation: pulse 1.3s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.5; }
    50% { opacity: 1; }
  }

  .bubble code {
    background: var(--code-bg);
    padding: 0.1em 0.35em;
    border-radius: 4px;
    font-size: 0.88em;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  .bubble pre {
    background: var(--code-bg);
    padding: 0.75em;
    border-radius: 8px;
    overflow-x: auto;
    margin: 0.4em 0;
    white-space: pre;
  }
  .bubble pre code { background: none; padding: 0; }

  .composer {
    flex: none;
    margin-top: 1rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: var(--shadow);
    padding: 0.9rem 1rem;
  }

  textarea#prompt {
    width: 100%;
    height: 3rem;
    font-family: inherit;
    font-size: 1rem;
    color: var(--text);
    background: transparent;
    border: none;
    outline: none;
    resize: none;
  }
  textarea#prompt::placeholder { color: var(--text-muted); }

  .composer-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 0.6rem;
  }

  .composer-footer .hint {
    font-size: 0.78rem;
    color: var(--text-muted);
  }

  .composer-footer .actions { display: flex; gap: 0.6rem; }

  button {
    border: none;
    border-radius: 9px;
    padding: 0.55rem 1.2rem;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.05s ease;
  }
  button:active:not(:disabled) { transform: scale(0.98); }
  button:disabled { opacity: 0.55; cursor: not-allowed; }

  button#send {
    background: var(--primary);
    color: #fff;
  }
  button#send:hover:not(:disabled) { background: var(--primary-hover); }

  button#reset {
    background: transparent;
    color: var(--text-muted);
    border: 1px solid var(--border);
  }
  button#reset:hover:not(:disabled) { color: var(--text); border-color: var(--text-muted); }
</style>
</head>
<body>
  <header>
    <h1>First Agent</h1>
    <p>A minimal agent: your message goes in, an LLM call comes back.</p>
  </header>

  <div class="chat" id="chat">
    <div class="empty-state" id="empty-state">Send a message to start the conversation.</div>
  </div>

  <div class="composer">
    <textarea id="prompt" placeholder="Ask the agent something..."></textarea>
    <div class="composer-footer">
      <span class="hint">Enter to send &middot; Shift+Enter for a new line</span>
      <div class="actions">
        <button id="reset" type="button">Reset</button>
        <button id="send" type="button">Send</button>
      </div>
    </div>
  </div>

<script>
const chatEl = document.getElementById('chat');
const emptyState = document.getElementById('empty-state');
const promptEl = document.getElementById('prompt');
const sendButton = document.getElementById('send');
const resetButton = document.getElementById('reset');

function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// Minimal, dependency-free markdown covering what LLM replies typically use:
// fenced/inline code and bold/italic. Line breaks are preserved by the
// bubble's `white-space: pre-wrap`, so no paragraph handling is needed here.
function renderMarkdown(raw) {
  const codeBlocks = [];
  let text = raw.replace(/```(?:\w*)\n?([\s\S]*?)```/g, (_, code) => {
    codeBlocks.push(`<pre><code>${escapeHtml(code.replace(/\n$/, ''))}</code></pre>`);
    return ` ${codeBlocks.length - 1} `;
  });

  text = escapeHtml(text);
  text = text.replace(/`([^`]+)`/g, (_, code) => `<code>${code}</code>`);
  text = text.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  text = text.replace(/(^|[^*\w])\*([^*\n]+)\*(?!\*)/g, '$1<em>$2</em>');

  return text.replace(/ (\d+) /g, (_, i) => codeBlocks[i]);
}

function addBubble(role, text, { loading = false } = {}) {
  emptyState.remove();
  const row = document.createElement('div');
  row.className = `bubble-row ${role}`;
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  if (loading) {
    bubble.classList.add('loading');
    bubble.textContent = text;
  } else if (role === 'assistant') {
    bubble.innerHTML = renderMarkdown(text);
  } else {
    bubble.textContent = text;
  }
  row.appendChild(bubble);
  chatEl.appendChild(row);
  chatEl.scrollTop = chatEl.scrollHeight;
  return bubble;
}

async function send() {
  const message = promptEl.value.trim();
  if (!message) return;

  promptEl.value = '';
  sendButton.disabled = true;

  addBubble('user', message);
  const replyBubble = addBubble('assistant', 'Thinking...', { loading: true });

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message }),
    });
    replyBubble.classList.remove('loading');
    if (!res.ok) {
      replyBubble.classList.add('error');
      replyBubble.textContent = `Error: request failed with status ${res.status}`;
    } else {
      const data = await res.json();
      replyBubble.innerHTML = renderMarkdown(data.reply);
    }
  } catch (e) {
    replyBubble.classList.remove('loading');
    replyBubble.classList.add('error');
    replyBubble.textContent = `Error: ${e}`;
  } finally {
    sendButton.disabled = false;
    promptEl.focus();
  }
}

sendButton.addEventListener('click', send);
promptEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    send();
  }
});

resetButton.addEventListener('click', async () => {
  resetButton.disabled = true;
  try {
    await fetch('/api/reset', { method: 'POST' });
    chatEl.innerHTML = '';
    const restored = document.createElement('div');
    restored.className = 'empty-state';
    restored.id = 'empty-state';
    restored.textContent = 'Conversation reset. Send a message to start again.';
    chatEl.appendChild(restored);
  } finally {
    resetButton.disabled = false;
    promptEl.focus();
  }
});

promptEl.focus();
</script>
</body>
</html>
